name: Full reproduction (manual)

# Reproduces the paper's results end-to-end and uploads all CSVs + figures as
# artifacts. Heavy (downloads BERT-large ~1.3 GB, runs SVDs + MLM eval), so it
# is manual-only. Choose which models to characterize via the input.

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to characterize (space-separated)"
        default: "bert-base-uncased albert-base-v2"
        required: true
      run_compression:
        description: "Run the compression experiment (BERT-base, WikiText-2)"
        type: boolean
        default: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Hugging Face models/datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-full-v1

      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Characterize spectra (E1/E2)
        run: |
          mkdir -p out figs
          python run_characterize.py ${{ github.event.inputs.models }}

      - name: Null envelopes (E2)
        run: python nullcontrol.py 200

      - name: Compression validation (E4)
        if: ${{ github.event.inputs.run_compression == 'true' }}
        run: python compression.py

      - name: Regenerate figures (E5)
        run: |
          TAGS=$(echo "${{ github.event.inputs.models }}" \
            | sed 's/bert-base-uncased/bert_base/g; s/albert-base-v2/albert/g; s/bert-large-uncased/bert_large/g')
          FIG_OUT=figs python figures_all.py $TAGS

      - name: Upload all outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-reproduction-outputs
          path: |
            out/*.csv
            figs/*.pdf
          if-no-files-found: warn
